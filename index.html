<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Key Bảo Mật</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 relative overflow-hidden">
        <!-- Glow effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <!-- Khung Nhập Key -->
        <div id="auth-section">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 mb-3 font-bold text-xl">
                    🔒
                </div>
                <h1 class="text-2xl font-bold tracking-tight">Xác Thực Truy Cập</h1>
                <p class="text-sm text-slate-400 mt-1">Vui lòng nhập key hợp lệ để tiếp tục</p>
            </div>

            <form id="key-form" onsubmit="handleVerify(event)" class="space-y-4">
                <div>
                    <label for="key-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Mã Key Của Bạn</label>
                    <input 
                        type="password" 
                        id="key-input" 
                        placeholder="Nhập key bảo mật..." 
                        class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-100 placeholder-slate-600 transition-all text-sm"
                        autocomplete="off"
                        required
                    >
                </div>
                
                <div id="error-msg" class="text-xs text-rose-500 hidden font-medium">⚠️ Key không chính xác, vui lòng thử lại!</div>

                <button 
                    type="submit" 
                    class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 font-medium rounded-xl transition-colors shadow-lg shadow-blue-500/20 text-sm cursor-pointer"
                >
                    Xác Thực
                </button>
            </form>
        </div>

        <!-- Nội dung hiển thị khi nhập đúng key (Ẩn ban đầu) -->
        <div id="content-section" class="hidden animate-fade-in">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 mb-3 font-bold text-xl">
                    ✨
                </div>
                <h2 class="text-2xl font-bold tracking-tight text-emerald-400">Xác Thực Thành Công</h2>
                <p class="text-sm text-slate-400 mt-1">Dưới đây là thông tin tài khoản của bạn</p>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3 mb-6">
                <div class="flex items-center justify-between">
                    <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Tài khoản:</span>
                    <span class="font-mono text-sm bg-slate-900 px-3 py-1 rounded-lg text-blue-400 border border-slate-800">tengge678909</span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Mật khẩu:</span>
                    <span class="font-mono text-sm bg-slate-900 px-3 py-1 rounded-lg text-rose-400 border border-slate-800">kieuluongtam</span>
                </div>
            </div>

            <button 
                onclick="handleReset()" 
                class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 font-medium rounded-xl transition-colors text-slate-300 text-sm cursor-pointer"
            >
                Khóa Lại
            </button>
        </div>
    </div>

    <script>
        const CORRECT_KEY = "codz";

        function handleVerify(event) {
            event.preventDefault();
            const inputVal = document.getElementById('key-input').value;
            const errorMsg = document.getElementById('error-msg');

            if (inputVal === CORRECT_KEY) {
                // Ẩn form nhập, hiện nội dung
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('content-section').classList.remove('hidden');
                errorMsg.classList.add('hidden');
            } else {
                // Báo lỗi
                errorMsg.classList.remove('hidden');
                document.getElementById('key-input').focus();
            }
        }

        function handleReset() {
            document.getElementById('key-input').value = '';
            document.getElementById('content-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
